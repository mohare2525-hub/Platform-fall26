<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello React!</title>
    <!-- import React libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>    
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.js"></script>
    <link rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" 
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" 
    crossorigin="anonymous">
  </head>
  
  <body>
    <!-- The body of the html document has one div tag with the id root.
    This is where we'll place our HTML generated by the React library. -->

    <div id="root"></div>
    <script type="text/babel">   

	


    // Reusable React component
    function NavMenu() {
      return (
         <ul class="nav justify-content-end">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="accessibility.html">Accessibility</a></li>
            <li class="nav-item"><a class="nav-link" href="javascript.html">Javascript</a></li>
            <li class="nav-item"><a class="nav-link" href="react.html">React</a></li>
        </ul>
      );
    }

    function Boomer() {
      return (
        <div>
           <h3>Hello my name is Boomer!</h3>
           <img width="200" height="250" src="images/boomer.png" />
        </div>
      )
    }

    function Grumpy() {
      return (
        <div>
           <h3>Hello my name is Grumpy!</h3>
           <img width="200" height="250" src="images/grumpy.jpg" />
        </div>
      )
    }

    //Customizable, reusable component
    //name and image are called properties
    function Pet({name, image}) {
      return (
        <div>
           <h3>Hello my name is {name}!</h3>
           <img width="200" height="250" src={image} />
        </div>
      )
    }

    //the final component that is displayed
    function App() {
      return (
        <div>
          <NavMenu />
          { /*must assign values to the properties name and image */}
          <Pet name="Boomer" image="images/boomer.png" />
          <Pet name="Grumpy" image="images/grumpy.jpg" />
        </div>
      );
    }

    var name = "Boomer";
    //create the root of the Virtual DOM
    //all React elements within the root will be stored in the Virtual DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    //root.render(<div><NavMenu /><h1>Hello World! and {name}</h1><p>This is a paragraph</p></div>);   
    //root.render(<div><NavMenu /><Boomer /><Grumpy /></div>);   
    //rener the App element
    root.render(<App />)
   </script>    
  </body>
</html>
